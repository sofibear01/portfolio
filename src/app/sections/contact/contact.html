<section id="contact" class="contact section">
  <app-section-heading
    index="04."
    [title]="languageService.t().contact.title"
    [subtitle]="languageService.t().contact.subtitle"
  />

  <div class="contact__content">
    <p class="contact__intro">
      {{ languageService.t().contact.intro }}
    </p>

    <div class="contact__actions">
      <a
        mat-flat-button
        color="primary"
        [href]="'https://wa.me/' + static.whatsapp"
        target="_blank"
        rel="noopener noreferrer"
      >
        <mat-icon>chat</mat-icon>
        WhatsApp
      </a>

      <a
        mat-stroked-button
        href="https://www.linkedin.com/in/sofia-bearzotti-2a86b424b/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <mat-icon>work</mat-icon>
        LinkedIn
      </a>

      <a
        mat-stroked-button
        href="https://github.com/sofibear01"
        target="_blank"
        rel="noopener noreferrer"
      >
        <mat-icon>code</mat-icon>
        GitHub
      </a>

      <a
        mat-stroked-button
        [href]="'mailto:' + static.email"
      >
        <mat-icon>mail</mat-icon>
        Email
      </a>
    </div>

    <div class="contact__location">
      <mat-icon>location_on</mat-icon>
      <span>{{ languageService.t().location }}</span>
    </div>
  </div>
</section>
