<section id="home" class="home">
  <div class="home__content">
    <p class="home__greeting">
      <span class="home__prompt">&gt;</span> {{ languageService.t().home.greeting }}
    </p>

    <h1 class="home__title">
      {{ languageService.t().home.titlePrefix }}
      <span class="home__name">{{ static.name }}</span>
    </h1>

    <h2 class="home__role">{{ languageService.t().role }}</h2>

    <p class="home__tagline">{{ languageService.t().tagline }}</p>

    <div class="home__chips">
      @for (tech of static.highlights; track tech) {
      <span class="home__chip">{{ tech }}</span>
      }
    </div>

    <div class="home__actions">
      <button mat-flat-button color="primary" class="home__cta" (click)="scrollTo('projects')">
        <mat-icon>rocket_launch</mat-icon>
        {{ languageService.t().home.viewProjects }}
      </button>
      <button mat-stroked-button class="home__cta home__cta--secondary" (click)="scrollTo('contact')">
        <mat-icon>mail</mat-icon>
        {{ languageService.t().home.getInTouch }}
      </button>
    </div>
  </div>

  <div class="home__visual">
    <div class="home__avatar-container">
      <img
        src="images/emoji.png"
        alt="Sofia Bearzotti"
        class="home__avatar"
      />
    </div>
  </div>

</section>
